[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-dlp"
dynamic = ["version"]
description = "Queue-based TikTok video, photo, and story downloader"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "bajaam"}]
keywords = [
    "tiktok",
    "downloader",
    "video",
    "photos",
    "stories",
    "archive",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/bajaam/tt-dlp"
Repository = "https://github.com/bajaam/tt-dlp.git"
Issues = "https://github.com/bajaam/tt-dlp/issues"
Changelog = "https://github.com/bajaam/tt-dlp/blob/main/CHANGELOG.md"

[project.scripts]
tt-dlp = "tt_dlp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "tt_dlp.__version__"}
